<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Website</title>
    <!-- Linking Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header / Navbar -->
    <header>
        <nav class="navbar section-content">
            <a href="#" class="nav-logo">
                <h2 class="logo-text">🥐 Pastry</h2>
            </a>
            <ul class="nav-menu">
                <button id="menu-close-button" class="fas fa-times"></button>

                <li class="nav-item">
                    <a href="#" class="nav-link"> Home </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link"> About </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link"> Menu </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link"> Testimonials </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link"> Gallery </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link"> Contact </a>
                </li>
            </ul>

            <button id="menu-open-button" class="fas fa-bars"></button>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
         <section class="hero-section">
             <div class="section-content">
                <div class="hero-details">
                    <h2 class="title">Mega Pastry</h2>
                    <h3 class="subtitle">Cherish Your Moment with a Bite of Happiness!</h3>
                    <p class="description">Welcome to our House of Pastry! A place where you can enjoy every bite of delicious pastry with your whole family.</p>

                    <div class="buttons">
                        <a href="#" class="button order-now">Order Now</a>
                        <a href="#" class="button contact-us">Contact Us</a>
                    </div>
                </div>
                <div class="hero-image-wrapper">
                    <img src="src/images/cupcake.png" alt="Hero1">
                </div>
            </div>
         </section>
    </main>
</body>
</html>
